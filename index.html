<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
  >

  <title>SafraLink — Entrar</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <!-- ==================================================
       SPLASH SCREEN
       ================================================== -->

  <div
    id="splash-screen"
    class="splash-screen"
  >
    <div class="splash-content">

      <div class="splash-logo">
        🌱
      </div>

      <div class="splash-name">
        SafraLink
      </div>

    </div>
  </div>


  <main class="auth-page">

    <section class="auth">

      <div class="auth-side">

        <div class="brand">

          <div class="brand-mark">
            🌱
          </div>

          <span>
            SafraLink
          </span>

        </div>

        <h1>
          Do campo para quem precisa.
        </h1>

        <p>
          Conectando produtores, comércios e consumidores
          para facilitar a comercialização e o escoamento
          da produção.
        </p>

        <div class="leafs">
          🌾 🧺 🚚
        </div>

      </div>


      <div class="auth-form">

        <h2>
          Bem-vinda!
        </h2>

        <p>
          Entre na sua conta para continuar.
        </p>


        <form id="login-form">

          <div class="field">

            <label>
              E-mail
            </label>

            <input
              class="input"
              id="login-email"
              type="email"
              placeholder="seu@email.com"
              required
            >

          </div>


          <div class="field">

            <label>
              Senha
            </label>

            <input
              class="input"
              id="login-password"
              type="password"
              placeholder="••••••••"
              required
            >

          </div>


          <button
            class="btn btn-primary"
            style="width:100%;margin-top:8px"
          >
            Entrar
          </button>

        </form>


        <div class="auth-link">

          Ainda não tem conta?

          <a href="cadastro.html">
            Criar cadastro
          </a>

        </div>

        <div style="margin-top:14px">
          <a
            class="btn btn-soft"
            href="cadastro-vendedor.html"
            style="width:100%;text-align:center"
          >
            Quero ser vendedor
          </a>
        </div>

      </div>

    </section>

  </main>


  <script src="js/app.js"></script>

</body>

</html>
