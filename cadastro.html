<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
  >

  <title>
    SafraLink — Cadastro
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <main class="auth-page">

    <section class="auth">

      <div class="auth-side">

        <div class="brand">

          <div class="brand-mark">
            🌱
          </div>

          <span>
            SafraLink
          </span>

        </div>


        <h1>
          Um cadastro simples.
        </h1>


        <p>
          Comece como usuário comum. Depois, se quiser
          vender sua produção, você poderá fazer um
          cadastro específico de vendedor.
        </p>


        <div class="leafs">
          🌱 🥕 🌽
        </div>

      </div>


      <div class="auth-form">

        <h2>
          Criar conta
        </h2>

        <p>
          Preencha seus dados básicos para começar.
        </p>


        <form id="signup-form">

          <div class="field">

            <label>
              Nome completo
            </label>

            <input
              class="input"
              id="signup-name"
              required
              placeholder="Seu nome"
            >

          </div>


          <div class="field">

            <label>
              E-mail
            </label>

            <input
              class="input"
              id="signup-email"
              type="email"
              required
              placeholder="seu@email.com"
            >

          </div>


          <div class="field">

            <label>
              Senha
            </label>

            <input
              class="input"
              type="password"
              required
              placeholder="Crie uma senha"
            >

          </div>


          <button
            class="btn btn-primary"
            style="width:100%;margin-top:8px"
          >
            Criar conta
          </button>

        </form>


        <div class="auth-link">

          Já tenho uma conta.

          <a href="index.html">
            Entrar
          </a>

        </div>

      </div>

    </section>

  </main>


  <script src="js/app.js"></script>

</body>

</html>
